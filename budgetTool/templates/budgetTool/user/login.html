<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Budget Tool</title>
  </head>
  <body style="margin-left: 20px; margin-right: 20px;">


<nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand">Login</a>
    
    <div class="collapse navbar-collapse" id="navbarColor02">
      
      <ul class="navbar-nav me-sm-2" style="display: flex; justify-content: flex-end;">
        <li class="nav-item">
            <a class="nav-link" href="{% url 'budgetTool:registerPage' %}">Register</a>
        </li>
      </ul>
      
    </div>
  </div>
</nav>

<div class="col-md-6 offset-md-3">
    {% if user.is_authenticated %}

    <h1>Logged in the system</h1>

    {% else %}
    <br/>

    <form method="POST" action="{% url 'budgetTool:login_user' %}">
        {% csrf_token %}
    
        <form>
            <div class="mb-3">
              <input type="text" class="form-control" name="username", placeholder="User Name" required>
            </div>
            <div class="mb-3">
              <input type="password" class="form-control" name="password", placeholder="Password" required>
            </div>

            <button type="submit" class="btn btn-outline-light">Submit</button>
          </form>
    
    </form>

    {% endif %}

</div>
  
    </body>

{% block content %}   

<div class="col-md-6 offset-md-3">
    {% if user.is_authenticated %}

    <h1>Logged in the system</h1>

    {% else %}
    <a class="btn btn-primary" href="{% url 'budgetTool:registerPage' %}" role="button" style="float: right;">Register</a>

    <h1> Login</h1>
    <br/>

    <form method="POST" action="{% url 'budgetTool:login_user' %}">
        {% csrf_token %}
    
        <form>
            <div class="mb-3">
              <input type="text" class="form-control" name="username", placeholder="User Name" required>
            </div>
            <div class="mb-3">
              <input type="password" class="form-control" name="password", placeholder="Password" required>
            </div>

            <button type="submit" class="btn btn-secondary">Submit</button>
          </form>
    
    </form>

    {% endif %}

</div>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Drop Table Rows with Order Storage</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th, td {
            padding: 15px;
            text-align: left;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .drag-handle {
            cursor: grab;
            user-select: none;
        }
    </style>
</head>
<body>

<table id="sortable-table">
    <thead>
        <tr>
            <th></th>
            <th>Name</th>
            <th>Age</th>
        </tr>
    </thead>
    <tbody>
        <tr data-book-id="1">
            <td class="drag-handle">&#9776;</td>
            <td>John Doe</td>
            <td>25</td>
        </tr>
        <tr data-book-id="2">
            <td class="drag-handle">&#9776;</td>
            <td>Jane Doe</td>
            <td>30</td>
        </tr>
        <!-- Add more rows as needed -->
    </tbody>
</table>

<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>

<script>
    $(document).ready(function () {
        const sortableTable = document.getElementById('sortable-table').getElementsByTagName('tbody')[0];

        new Sortable(sortableTable, {
            handle: '.drag-handle',
            animation: 150,
            onEnd: function (evt) {
                const rows = Array.from(sortableTable.children);
                const bookIdsInNewOrder = rows.map(row => row.dataset.bookId);
                console.log("changed")
                // Send the updated order to the server
                $.post('/update_book_order/', { new_order: bookIdsInNewOrder }, function (data) {
                    console.log(data.message);  // Log the response from the server
                    console.log("changed")
                });
            }
        });
    });
</script>

</body>
</html>

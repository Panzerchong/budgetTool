      <h1>Rate table</h1>


      <table class="table table-sm table-hover table-bordered w-auto">
        <thead>

            <th class="table-primary" scope="col">List</th>
            <th class="table-primary" scope="col">Cost</th>

            <td>{{line.type}}</td>
            <td>{{line.list}}</td>
            <td>{{line.cost}}</td>
          </tr>
          {% endfor %}
          
        </tbody>
      </table>

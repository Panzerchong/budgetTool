<!doctype html>
{% load bootstrap5 %}
{% bootstrap_css %}
{% bootstrap_javascript %}

<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Budget Tool</title>
  
  </head>
  <body style="margin-left: 20px; margin-right: 20px;">


  <a class="btn btn-primary" href="/budgetTool/rate_table" role="button">Rate Table</a>
  <a class="btn btn-primary" href="/budgetTool/price_sheet" role="button">Price Sheet</a>
  <a class="btn btn-primary" href="/budgetTool/create" role="button">Create a new project template</a>
  <h1>Project lists</h1>

    <ul>
      {% for project in projects %}
        <li>
            <a href="/budgetTool/{{project.pk}}">{{project.name}}</a> 
        </li>
      {% endfor %}
    </ul>

  <div class="dropdown">
      <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        Create a new project copy
      </button>
      <ul class="dropdown-menu">

        {% for project in projects %}
          <li><a class="dropdown-item" href="{% url 'budgetTool:copy_project' pk=project.pk %}">{{project.name}}</a></li>
        {% endfor %}

      </ul>
    </div>

  </body>
</html>

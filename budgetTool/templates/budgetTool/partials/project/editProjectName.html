<form
    hx-post="{% url 'budgetTool:editProject' pk=project.pk%}"
    hx-on="htmx:afterRequest: window.location.reload(true)"
    >
    {% csrf_token %}
    <input type="text" name="name" value="{{project.name}}"  autofocus>
    <button class="btn btn-outline-success"> Save</button>
    <button class="btn btn-outline-light" type="button" onclick="window.location.reload(true)"> Cancel</button>
</form>

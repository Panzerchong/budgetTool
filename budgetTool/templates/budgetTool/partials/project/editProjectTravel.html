<form
    hx-post="{% url 'budgetTool:editProject' pk=project.pk%}"
    hx-on="htmx:afterRequest: window.location.reload(true)"
    style="display: flex; align-items: center;"
    >
    {% csrf_token %}
    <input type="number" name="travel_weekly" value="{{project.travel_weekly}}" min="0" autofocus>
    <button class="btn btn-success"> Save</button>
    <button class="btn btn-secondary" type="button" onclick="window.location.reload(true)"> Cancel</button>
</form>

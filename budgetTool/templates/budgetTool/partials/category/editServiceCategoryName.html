<!-- use view context to pass parameter  -->

<table>
    <tr>
        <td>
            <form
                hx-post="{% url 'budgetTool:service_category_edit' pk=category.id %}"
                hx-on="htmx:afterRequest: window.location.reload(true)"
                style="display: flex; align-items: center;"
                >
                {% csrf_token %}
                <input type="text" name="name" value="{{category.name}}" autofocus>
                <button class="btn btn-outline-success"> Save</button>
                <button class="btn btn-outline-light" type="button" onclick="redirectToCurrentPage()" > Cancel</button>
            </form>
        </td>

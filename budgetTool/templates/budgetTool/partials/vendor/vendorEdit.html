<form 
hx-post="{% url 'budgetTool:vendor_edit' pk=vendor.pk %}" 
hx-on="htmx:afterRequest: window.location.reload(true)"
hx-target="this">
    {% csrf_token %}
    <tr>
      <td>{{form.index}}</td>
      <td>{{ form.name }}</td>
      <td><button type="submit" class="btn btn-success">Save</button></td>
      <td>
        <button type="button"class="btn btn-secondary" 
          onclick="window.location.reload(true)"
        >Cancel</button>
      </td>
      <td>
        <button 
        class="btn btn-danger"
        hx-confirm="Are you sure?"
        hx-get="{% url 'budgetTool:vendor_delete' pk=vendor.pk %}"
        hx-on="htmx:afterRequest: window.location.reload(true)"
        >
          Delete
        </button>
    </tr>
    <hr>
</form>

<div class="container">
  {% if messages %}
    {% for message in messages %}
      
    <div class="alert alert-warning alert-dismissible fade show" role="alert">
      {{message}}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    {% endfor %}
  {% endif %}
</div> 

{% if user.is_authenticated %}
<nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/budgetTool/">Back</a>
      
    <ul class="navbar-nav">
      <li class="nav-item">
          <a class="nav-link" href="{% url 'budgetTool:change_password' %}">Edit password</a>
      </li>

      <li class="nav-item">
          <a class="nav-link" href="{% url 'budgetTool:logout_user' %}">Logout</a>
      </li>
    </ul>
      
    </div>
  </div>
</nav>
{% endif %}
